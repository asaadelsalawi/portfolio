<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Team navigation 2023–2026</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#FFFFFF;
    --ink:#0b0d12;
    --text-secondary:#4e5463;
    --text-tertiary:#6c7284;
    --bg-secondary:#f5f7fa;
    --border-default:#d6ddeb;
    --lime:#cff000; --lime-light:#f5fccc; --lime-dark:#829318;
    --coral:#f67145; --coral-light:#fde3da; --coral-dark:#96543b;
    --green:#3df029; --green-light:#d8fcd4; --green-dark:#3a932d;
    --blue:#4396f5; --blue-light:#d9eafd; --blue-dark:#3d6692;
    --purple:#e15ef2; --purple-light:#f9dffc; --purple-dark:#8b4a91;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  #root{ width:100%; margin:0; padding:24px 0 48px; }
  h1{ font-size:20px; font-weight:600; margin:0 0 4px; }
  .subtitle{ font-size:14px; color:var(--text-secondary); margin:0 0 24px; max-width:620px; line-height:1.5; }
  .stage{ width:100%; overflow:visible; }
  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
  .legend-item{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px 5px 6px; border-radius:999px;
    border:1px solid var(--border-default);
    background:var(--bg-secondary);
    font-size:12px; font-weight:500; color:var(--text-secondary);
    cursor:pointer; user-select:none; transition:opacity 0.15s;
  }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-item.dim{ opacity:0.35; }
  .node-rect{ cursor:pointer; transition:opacity 0.15s; }
  .node-rect.dim{ opacity:0.2; }
  .ribbon{ transition:opacity 0.15s; cursor:pointer; }
  .ribbon.dim{ opacity:0.06; }
  .ribbon.active{ opacity:0.75; }
  .node-label{ font-size:11px; font-weight:600; pointer-events:none; }
  .node-count{ font-size:11px; font-weight:700; pointer-events:none; }
  .year-label{ font-size:12px; font-weight:600; fill:var(--text-secondary); }
  .tooltip{
    position:fixed; pointer-events:none; z-index:50;
    background:var(--ink); color:var(--bg);
    font-size:12px; line-height:1.5; padding:8px 10px; border-radius:8px;
    max-width:220px; box-shadow:0 4px 16px rgba(0,0,0,0.2);
    opacity:0; transition:opacity 0.1s;
  }
  .tooltip.show{ opacity:1; }
  .tooltip b{ display:block; margin-bottom:2px; }
</style>
</head>
<body>
<div id="root">
  <h1>Team navigation, 2023–2026</h1>
  <p class="subtitle">How 15 people moved through the team over four years. Each column is a year, each block a state, each ribbon the people moving between two years. Tap or hover anything to trace it.</p>
  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  var YEARS = [2023, 2024, 2025, 2026];

  // Renamed to plain, human wording. `source` = exact wording in the sheet.
  var STATES = [
    { id: 'on-team',   source: 'In My Team',           label: 'On my team',               varName: '--lime' },
    { id: 'new-hire',  source: 'Joined From Outside',  label: 'New hire',                 varName: '--lime-light' },
    { id: 'moved-in',  source: 'Joined From Within',   label: 'Moved from another team',  varName: '--lime-light' },
    { id: 'moved-out', source: 'Left Within',          label: 'Moved to another team',    varName: '--purple-light' },
    { id: 'left-co',   source: 'Left Outside',         label: 'Left the company',         varName: '--coral-light' },
    { id: 'elsewhere', source: 'Other Business Area',  label: 'Elsewhere in the company', varName: '--purple-light' },
    { id: 'not-at-co', source: 'Not In Business',      label: 'Not at the company',        varName: '--coral-light' },
    { id: 'no-data',   source: null,                   label: 'No data',                   varName: '--bg-secondary', neutral: true },
  ];
  var STATE_BY_ID = {};
  STATES.forEach(function (s, i) { STATE_BY_ID[s.id] = Object.assign({}, s, { index: i }); });
  var STATE_BY_SOURCE = {};
  STATES.forEach(function (s) { if (s.source) STATE_BY_SOURCE[s.source.toLowerCase()] = s.id; });

  // [personId, 2023, 2024, 2025, 2026] — from Alluvial_diagram.xlsx (updated)
  var ROWS = [
    ['BW2', 'Joined From Outside', 'In My Team', 'In My Team', 'In My Team'],
    ['AP',  'Other Business Area', 'Joined From Within', 'In My Team', null],
    ['AR',  'Not In Business', 'Joined From Outside', 'In My Team', 'In My Team'],
    ['BR',  'Other Business Area', 'Joined From Within', 'Left Outside', 'Not In Business'],
    ['BW',  'In My Team', 'In My Team', 'Left Outside', 'Not In Business'],
    ['DJ',  'Joined From Outside', 'Left Within', 'Other Business Area', 'In My Team'],
    ['EL',  'Joined From Within', 'Left Outside', 'Not In Business', 'Not In Business'],
    ['GV',  'In My Team', 'In My Team', 'Left Within', 'Other Business Area'],
    ['HH',  'Not In Business', 'Not In Business', 'Joined From Outside', 'In My Team'],
    ['LW',  'Other Business Area', 'Joined From Within', 'In My Team', 'In My Team'],
    ['RT',  'Not In Business', 'Not In Business', 'Joined From Outside', 'In My Team'],
    ['SB',  'Not In Business', 'Joined From Outside', 'In My Team', 'Left Outside'],
    ['SL',  'Other Business Area', 'Other Business Area', 'Joined From Within', 'In My Team'],
    ['TM',  'Not In Business', 'Not In Business', 'Not In Business', 'Joined From Outside'],
    ['VN',  'Not In Business', 'Joined From Within', 'Left Within', 'Other Business Area'],
  ];

  function stateOf(cell) {
    if (cell == null || String(cell).trim() === '') return 'no-data';
    var id = STATE_BY_SOURCE[String(cell).trim().toLowerCase()];
    if (!id) throw new Error('Unknown state in data: "' + cell + '"');
    return id;
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function buildModel(rows, years) {
    var cols = years.map(function (year, c) {
      var nodes = STATES.map(function (s) {
        var people = rows.filter(function (r) { return stateOf(r[c + 1]) === s.id; }).map(function (r) { return r[0]; });
        return { id: year + ':' + s.id, state: s.id, col: c, year: year, people: people, count: people.length };
      }).filter(function (n) { return n.count > 0; });
      return { year: year, nodes: nodes };
    });

    var links = [];
    for (var c = 0; c < years.length - 1; c++) {
      var buckets = {};
      rows.forEach(function (r) {
        var from = stateOf(r[c + 1]);
        var to = stateOf(r[c + 2]);
        var key = c + ':' + from + '>' + to;
        if (!buckets[key]) buckets[key] = { key: key, col: c, from: from, to: to, people: [] };
        buckets[key].people.push(r[0]);
      });
      Object.keys(buckets).forEach(function (k) {
        var b = buckets[k];
        links.push(Object.assign({}, b, { count: b.people.length }));
      });
    }
    return { years: years, cols: cols, links: links, total: rows.length };
  }

  var model = buildModel(ROWS, YEARS);

  function stateColor(id) {
    var s = STATE_BY_ID[id];
    var v = cssVar(s.varName);
    return v;
  }
  function stateInk(id) {
    var s = STATE_BY_ID[id];
    if (s.neutral) return cssVar('--text-tertiary');
    if (s.ink) return cssVar(s.ink);
    return cssVar('--ink');
  }

  // ---- Layout (shared math, oriented per breakpoint) ----------------
  function computeLayout(vertical) {
    var stage = document.getElementById('stage');
    var W = window.innerWidth;
    var mainLen = vertical ? YEARS.length : YEARS.length; // 4 steps either way
    var crossSize = vertical ? Math.max(320, W) : 420;     // height (horiz) / width driver (vert)
    var mainSize = vertical ? Math.max(560, YEARS.length * 170) : W;
    var nodeThick = 34; // node breadth along the cross axis's *thin* dimension
    var gap = 6;
    var mainPad = nodeThick + 8; // enough room so the first/last node's own width doesn't clip at the edge
    var crossPad = 56;  // margin reserved for the year label on the cross axis (above the column in horizontal, left of the row in vertical)

    var mainStep = (mainSize - mainPad * 2) / (YEARS.length - 1);
    var crossLen = crossSize - crossPad * 2;

    var maxNodes = Math.max.apply(null, model.cols.map(function (c) { return c.nodes.length; }));
    var k = (crossLen - gap * (maxNodes - 1)) / model.total;

    var nodes = {};
    model.cols.forEach(function (col, c) {
      var pos = crossPad;
      col.nodes.forEach(function (n) {
        var len = n.count * k;
        nodes[n.id] = Object.assign({}, n, { mainPos: mainPad + c * mainStep, crossPos: pos, len: len });
        pos += len + gap;
      });
    });

    var links = model.links.map(function (l) { return Object.assign({}, l, { thick: l.count * k }); });

    // outgoing ribbons leave a node ordered by target-state index; incoming arrive ordered by source-state index
    var outCursor = {}, inCursor = {};
    links.sort(function (a, b) { return STATE_BY_ID[a.to].index - STATE_BY_ID[b.to].index; });
    links.forEach(function (l) {
      var fromId = YEARS[l.col] + ':' + l.from;
      outCursor[fromId] = outCursor[fromId] || 0;
      l.outStart = nodes[fromId].crossPos + outCursor[fromId];
      outCursor[fromId] += l.thick;
    });
    links.sort(function (a, b) { return STATE_BY_ID[a.from].index - STATE_BY_ID[b.from].index; });
    links.forEach(function (l) {
      var toId = YEARS[l.col + 1] + ':' + l.to;
      inCursor[toId] = inCursor[toId] || 0;
      l.inStart = nodes[toId].crossPos + inCursor[toId];
      inCursor[toId] += l.thick;
    });

    return { nodes: nodes, links: links, mainSize: mainSize, crossSize: crossSize, nodeThick: nodeThick, mainStep: mainStep, mainPad: mainPad, crossPad: crossPad };
  }

  function ribbonPath(l, layout, vertical, nodeThick) {
    var m1 = layout.nodes[YEARS[l.col] + ':' + l.from].mainPos + nodeThick;
    var m2 = layout.nodes[YEARS[l.col + 1] + ':' + l.to].mainPos;
    var mMid = (m1 + m2) / 2;
    var c1a = l.outStart, c1b = l.outStart + l.thick;
    var c2a = l.inStart, c2b = l.inStart + l.thick;

    function pt(main, cross) { return vertical ? (cross + ',' + main) : (main + ',' + cross); }

    return [
      'M', pt(m1, c1a),
      'C', pt(mMid, c1a), pt(mMid, c2a), pt(m2, c2a),
      'L', pt(m2, c2b),
      'C', pt(mMid, c2b), pt(mMid, c1b), pt(m1, c1b),
      'Z',
    ].join(' ');
  }

  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  var activeState = null;
  var tooltip = document.getElementById('tooltip');

  function showTooltip(evt, html) {
    tooltip.innerHTML = html;
    tooltip.classList.add('show');
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    var x = evt.clientX, y = evt.clientY;
    tooltip.style.left = Math.min(x + 14, window.innerWidth - 240) + 'px';
    tooltip.style.top = Math.max(y - 10, 8) + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  function render() {
    var vertical = window.innerWidth < 640;
    var stage = document.getElementById('stage');
    stage.innerHTML = '';

    var layout = computeLayout(vertical);
    var svgW = vertical ? layout.crossSize : layout.mainSize;
    var svgH = vertical ? layout.mainSize : layout.crossSize;

    var svg = el('svg', {
      viewBox: '0 0 ' + svgW + ' ' + svgH,
      width: '100%',
      height: vertical ? Math.min(svgH, 900) : Math.min(svgH, 480),
      style: 'display:block',
    });

    // year labels
    YEARS.forEach(function (y, c) {
      var mainPos = layout.mainPad + c * layout.mainStep;
      var t = el('text', {
        class: 'year-label',
        x: vertical ? 4 : mainPos + layout.nodeThick / 2,
        y: vertical ? mainPos + layout.nodeThick / 2 : 20,
        'text-anchor': vertical ? 'start' : 'middle',
        'dominant-baseline': 'central',
      });
      t.textContent = y;
      svg.appendChild(t);
    });

    var defs = el('defs', {});
    svg.appendChild(defs);

    // ribbons
    var ribbonEls = [];
    layout.links.forEach(function (l, i) {
      var d = ribbonPath(l, layout, vertical, layout.nodeThick);
      var gradId = 'ribbon-grad-' + i;
      var grad = el('linearGradient', vertical
        ? { id: gradId, x1: '0%', y1: '0%', x2: '0%', y2: '100%' }
        : { id: gradId, x1: '0%', y1: '0%', x2: '100%', y2: '0%' });
      var stop1 = el('stop', { offset: '0%', 'stop-color': stateColor(l.from) });
      var stop2 = el('stop', { offset: '100%', 'stop-color': stateColor(l.to) });
      grad.appendChild(stop1);
      grad.appendChild(stop2);
      defs.appendChild(grad);

      var path = el('path', {
        class: 'ribbon',
        d: d,
        fill: 'url(#' + gradId + ')',
        opacity: 0.55,
      });
      path.dataset.from = l.from;
      path.dataset.to = l.to;
      path.dataset.people = l.people.join(',');
      path.addEventListener('mouseenter', function (e) { highlightPeople(l.people); showTooltip(e, ribbonTip(l)); });
      path.addEventListener('mousemove', moveTooltip);
      path.addEventListener('mouseleave', function () { highlightPeople(null); hideTooltip(); });
      svg.appendChild(path);
      ribbonEls.push(path);
    });

    // nodes
    Object.keys(layout.nodes).forEach(function (id) {
      var n = layout.nodes[id];
      var x = vertical ? n.crossPos : n.mainPos;
      var y = vertical ? n.mainPos : n.crossPos;
      var w = vertical ? n.len : layout.nodeThick;
      var h = vertical ? layout.nodeThick : n.len;

      var rect = el('rect', {
        class: 'node-rect',
        x: x, y: y, width: w, height: h,
        rx: 4,
        fill: stateColor(n.state),
        stroke: cssVar('--bg'),
        'stroke-width': 2,
      });
      rect.dataset.state = n.state;
      rect.dataset.people = n.people.join(',');
      rect.addEventListener('mouseenter', function (e) { highlightPeople(n.people); showTooltip(e, nodeTip(n)); });
      rect.addEventListener('mousemove', moveTooltip);
      rect.addEventListener('mouseleave', function () { highlightPeople(null); hideTooltip(); });
      svg.appendChild(rect);

      if (n.len > 16) {
        var count = el('text', {
          class: 'node-count',
          x: x + w / 2, y: y + h / 2,
          'text-anchor': 'middle', 'dominant-baseline': 'central',
          fill: stateInk(n.state),
        });
        count.textContent = n.count;
        svg.appendChild(count);
      }
    });

    stage.appendChild(svg);

    function highlightPeople(people) {
      var set = people ? new Set(people) : null;
      ribbonEls.forEach(function (p) {
        var mine = p.dataset.people.split(',').some(function (id) { return set && set.has(id); });
        p.classList.toggle('active', !!set && mine);
        p.classList.toggle('dim', !!set && !mine);
      });
      Array.prototype.forEach.call(svg.querySelectorAll('.node-rect'), function (r) {
        var mine = r.dataset.people.split(',').some(function (id) { return set && set.has(id); });
        r.classList.toggle('dim', !!set && !mine);
      });
    }

    function nodeTip(n) {
      var label = STATE_BY_ID[n.state].label;
      return '<b>' + n.year + ' · ' + label + '</b>' + n.count + ' ' + (n.count === 1 ? 'person' : 'people') + ': ' + n.people.join(', ');
    }
    function ribbonTip(l) {
      var fromLabel = STATE_BY_ID[l.from].label, toLabel = STATE_BY_ID[l.to].label;
      return '<b>' + YEARS[l.col] + ' → ' + YEARS[l.col + 1] + '</b>' + fromLabel + ' → ' + toLabel + '<br>' + l.people.join(', ');
    }
  }

  function renderLegend() {
    var usedIds = new Set();
    model.cols.forEach(function (c) { c.nodes.forEach(function (n) { usedIds.add(n.state); }); });
    var legend = document.getElementById('legend');
    legend.innerHTML = '';
    STATES.filter(function (s) { return usedIds.has(s.id); }).forEach(function (s) {
      var item = document.createElement('div');
      item.className = 'legend-item';
      var sw = document.createElement('span');
      sw.className = 'legend-swatch';
      sw.style.background = cssVar(s.varName);
      item.appendChild(sw);
      item.appendChild(document.createTextNode(s.label));
      legend.appendChild(item);
    });
  }

  renderLegend();
  render();
  requestAnimationFrame(function () { requestAnimationFrame(render); });
  var resizeT;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(render, 120);
  });
})();
</script>
</body>
</html>
